name: Release APK

# Public distribution without a Play Store account. The release APK is built
# and device-verified locally, committed under releases/, and attached here
# when a version tag is pushed:
#   git tag v1.0.6 && git push origin v1.0.6
# (Cloud builds were tried and shelved: the Gradle step fails on runners for
# reasons invisible without repo-admin log access. Local builds are reliable.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "releases/*.apk"
          generate_release_notes: true
          body: |
            ## Install on Android
            1. Download the APK below onto your phone.
            2. Open it and allow "Install unknown apps" when asked.
            3. Works on any network. No account needed to read.

            StoryNest talks to its hosted backend, so the app stays up to date
            from here: future versions appear as new releases on this page.
